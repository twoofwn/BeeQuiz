<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" aria-label="BeeQuiz bee buzz" role="img">
<style>

svg{overflow:visible;shape-rendering:crispEdges;image-rendering:pixelated}
.shadow{opacity:.12}
.left-wing{transform-box:fill-box;transform-origin:80% 75%;}
.right-wing{transform-box:fill-box;transform-origin:20% 75%;}
.bee-body{transform-box:fill-box;transform-origin:50% 50%;}

.bee { animation: buzz .22s linear infinite; }
.left-wing{ animation: flap-left .12s steps(2,end) infinite alternate; }
.right-wing{ animation: flap-right .12s steps(2,end) infinite alternate; }
.trail1,.trail2,.trail3{ fill:none; stroke:#76C0EC; stroke-width:3; stroke-linecap:round; opacity:.8; }
.trail1{ animation: trail 1.2s linear infinite; } .trail2{ animation: trail 1.2s .2s linear infinite; } .trail3{ animation: trail 1.2s .4s linear infinite; }
@keyframes buzz { 0%,100%{ transform: translate(0px,0px); } 25%{ transform: translate(-1px,-2px); } 50%{ transform: translate(1px,1px); } 75%{ transform: translate(-1px,1px); } }
@keyframes flap-left { from{ transform: rotate(-5deg); opacity:.88; } to{ transform: rotate(-28deg) translateY(-3px); opacity:1; } }
@keyframes flap-right { from{ transform: rotate(5deg); opacity:.88; } to{ transform: rotate(28deg) translateY(-3px); opacity:1; } }
@keyframes trail { 0%{ opacity:0; } 25%,75%{ opacity:.85; } 100%{ opacity:0; } }
</style>
