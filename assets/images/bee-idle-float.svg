<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" aria-label="BeeQuiz bee idle float" role="img">
<style>

svg{overflow:visible;shape-rendering:crispEdges;image-rendering:pixelated}
.shadow{opacity:.12}
.left-wing{transform-box:fill-box;transform-origin:80% 75%;}
.right-wing{transform-box:fill-box;transform-origin:20% 75%;}
.bee-body{transform-box:fill-box;transform-origin:50% 50%;}

.bee { animation: bob 2.8s ease-in-out infinite; }
.left-wing{ animation: flap-left .26s steps(2,end) infinite alternate; }
.right-wing{ animation: flap-right .26s steps(2,end) infinite alternate; }
@keyframes bob { 0%,100%{ transform: translate(0px,0px) rotate(-1deg); } 50%{ transform: translate(0px,-6px) rotate(1deg); } }
@keyframes flap-left { from{ transform: rotate(-8deg) translateY(0px); } to{ transform: rotate(-20deg) translateY(-2px); } }
@keyframes flap-right { from{ transform: rotate(8deg) translateY(0px); } to{ transform: rotate(20deg) translateY(-2px); } }
</style>
