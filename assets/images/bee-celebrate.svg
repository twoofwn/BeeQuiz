<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-label="BeeQuiz bee celebrate" role="img">
<style>

svg{overflow:visible;shape-rendering:crispEdges;image-rendering:pixelated}
.shadow{opacity:.12}
.left-wing{transform-box:fill-box;transform-origin:80% 75%;}
.right-wing{transform-box:fill-box;transform-origin:20% 75%;}
.bee-body{transform-box:fill-box;transform-origin:50% 50%;}

.bee { animation: hop 1.4s ease-in-out infinite; }
.left-wing{ animation: flap-left .18s steps(2,end) infinite alternate; }
.right-wing{ animation: flap-right .18s steps(2,end) infinite alternate; }
.sparkle1,.sparkle2,.sparkle3,.sparkle4{ transform-origin:center; animation: twinkle 1.4s ease-in-out infinite; }
.sparkle2{ animation-delay:.2s; } .sparkle3{ animation-delay:.5s; } .sparkle4{ animation-delay:.8s; }
@keyframes hop { 0%,100%{ transform: translate(0px,8px) rotate(0deg); } 35%{ transform: translate(0px,-8px) rotate(-4deg); } 70%{ transform: translate(0px,0px) rotate(4deg); } }
@keyframes flap-left { from{ transform: rotate(-6deg); } to{ transform: rotate(-22deg) translateY(-2px); } }
@keyframes flap-right { from{ transform: rotate(6deg); } to{ transform: rotate(22deg) translateY(-2px); } }
@keyframes twinkle { 0%,100%{ transform:scale(.75); opacity:.45; } 50%{ transform:scale(1.12); opacity:1; } }
</style>
